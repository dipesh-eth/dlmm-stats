version: '3.8'

services:
  meteora-bot:
    build:
      context: .
      dockerfile: dockerfile
    container_name: meteora-discord-bot
    restart: unless-stopped
    environment:
      # Discord Configuration
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      # Meteora DLMM Data API
      - METEORA_API_BASE=${METEORA_API_BASE:-https://dlmm.datapi.meteora.ag}
      # Helius RPC
      - HELIUS_API_KEY=${HELIUS_API_KEY}
      # Execution / wallet encryption
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - RPC_ENDPOINT=${RPC_ENDPOINT}
      # Optional read-only phone/widget API. It remains disabled without API_TOKEN.
      - API_TOKEN=${API_TOKEN}
      - API_PORT=3000
      # Node Environment
      - NODE_ENV=production
    # Optional: Mount logs directory
    volumes:
      - ./logs:/app/logs
      - ./wallets.json:/app/wallets.json
      - ./bot-database.db:/app/bot-database.db
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Network configuration (optional)
    networks:
      - bot-network

  caddy:
    image: caddy:2-alpine
    container_name: metlp-https-proxy
    restart: unless-stopped
    depends_on:
      - meteora-bot
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
